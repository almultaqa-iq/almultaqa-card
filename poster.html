<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملصق الطاولة - بطاقة الملتقى</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="lib/qrcode.js"></script>
<style>
  @page{size:A6 portrait;margin:0}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"IBM Plex Sans Arabic",sans-serif;background:#ddd;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  .p{width:105mm;height:148mm;background:#92735E;color:#FEF9EE;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12mm 9mm 9mm;text-align:center;position:relative;overflow:hidden}
  .p .logo{height:13mm}
  .p h1{font-size:19pt;line-height:1.3;font-weight:700}
  .p h1 span{color:#FEF9EE;display:block;font-size:11pt;font-weight:400;opacity:.85;margin-top:2mm}
  .q{background:#FEF9EE;padding:4mm;border-radius:4mm}
  .p ul{list-style:none;font-size:10pt;line-height:1.8}
  .p ul b{color:#fff;background:#E35C45;border-radius:2mm;padding:0 2mm}
  .p .f{font-size:8pt;opacity:.8;letter-spacing:.5px}
  .no-print{font-size:14px;color:#333;max-width:420px;text-align:center}
  @media print{body{background:none;padding:0}.no-print{display:none}}
</style>
</head>
<body>
<div class="no-print">هذا ملصق الطاولة بمقاس A6. اطبعه من المتصفح (Ctrl+P) بدون هوامش. الكود يفتح صفحة البطاقة مباشرة.</div>
<div class="p">
  <img class="logo" src="logo-ar.png" alt="الملتقى">
  <h1>بطاقة الملتقى<span>امسح الكود وسجّل بأقل من دقيقة</span></h1>
  <div class="q"><div id="qr"></div></div>
  <ul>
    <li>كل <b>9</b> أختام، العاشر علينا</li>
    <li>بعيد ميلادك خصم <b>50%</b></li>
  </ul>
  <div class="f">ALMULTAQA CAFE · خليك ويانا</div>
</div>
<script>
  const url = location.href.replace(/poster\.html.*$/, '');
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize:5, margin:0, scalable:true })
    .replace('<svg ', '<svg style="width:45mm;height:45mm;display:block" ')
    .replace('fill="white"', 'fill="#FEF9EE"').replace('fill="black"', 'fill="#292522"');
</script>
</body>
</html>
